<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern dark rounded container -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.55" />

  <!-- Circuit corner nodes -->
  <circle cx="26" cy="26" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="102" cy="26" r="3.5" fill="#8b5cf6" opacity="0.8" />
  <circle cx="64" cy="110" r="3.5" fill="#10b981" opacity="0.9" />

  <!-- Futuristic "A" Monogram for Amine -->
  <path d="M 64 24 L 95 98 L 79 98 L 72 80 L 56 80 L 49 98 L 33 98 Z M 64 45 L 59 69 L 69 69 Z" 
        fill="url(#glowGrad)" 
        filter="url(#glow)" />

  <!-- Horizontal Tech Crossbar Detail -->
  <rect x="52" y="66" width="24" height="4" rx="2" fill="#38bdf8" opacity="0.9" />
</svg>
